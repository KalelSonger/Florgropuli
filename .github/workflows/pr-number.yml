name: Number Pull Requests

on:
    pull_request:
        types: [opened]

permissions:
    pull-requests: write

jobs:
    number-pr:
        runs-on: ubuntu-latest

        steps:
            - name: Number PR
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                PR_NUMBER: ${{ github.event.pull_request.number }}
                PR_TITLE: ${{ github.event.pull_request.title }}
                REPO: ${{ github.repository }}
              run: |
                # find highest existing PR prefix
                LAST=$(gh pr list \
                  --repo "$REPO" \
                  --state all \
                  --limit 1000 \
                  --json title \
                  --jq '.[].title' |
                  grep -oE '^#[0-9]{4}:' |
                  grep -oE '^[0-9]{4}' |
                  sort -n |
                  tail -1)

                if [ -z "$LAST" ]; then
                  NEXT=0
                else
                  NEXT=$((10#$LAST + 1))
                fi

                PREFIX=$(printf "#%04d" "NEXT")

                # don't number twice
                if [[ "$PR_TITLE" =~ ^#[0-9]{4}: ]]; then
                  exit 0
                fi

                NEW_TITLE="$PREFIX: $PR_TITLE"

                gh pr edit "$PR_NUMBER" \
                  --repo "$REPO"
                  --title "$NEW_TITLE"